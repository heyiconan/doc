// ② 解析并加载 ---------------------------------------------------------
async function loadGongfa(){
  const sections = gongfaTxt
      .split(/\n={10,}\n/)          // 10 个以上 "=" 为分隔
      .map(s=>s.trim())
      .filter(Boolean);

  window.gongfaData = sections.map(sec=>{
    const title = (sec.match(/^【(.+?)】/)||[,'未知功法'])[1];
    const sect  = (sec.match(/([\u4e00-\u9fa5·]+)所属门派/) || [,''])[1];
    const grade = (sec.match(/([\u4e00-\u9fa5·]+?品级)/)   || [,''])[1];
    const attr  = (sec.match(/([\u4e00-\u9fa5·]+)属性/)   || [,''])[1];
    const type  = (sec.match(/([\u4e00-\u9fa5·]+)功法类型/)|| [,''])[1];
    return {title,content:sec,sect,grade,attr,type};
  });

  populateFilters();
  renderList(window.gongfaData,'');
}

// ③ 填充下拉框选项
function populateFilters(){
  const map={sect:'sectFilter',grade:'gradeFilter',attr:'attrFilter',type:'typeFilter'};
  for(const [field,id] of Object.entries(map)){
    const sel=document.getElementById(id);
    [...new Set(window.gongfaData.map(g=>g[field]).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b,'zh'))
      .forEach(v=>{
        const op=document.createElement('option');
        op.value=op.textContent=v;
        sel.appendChild(op);
      });
  }
}

// ④ 工具：转义 & 高亮
function escHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function highlight(txt,kw){
  if(!kw)return escHTML(txt);
  const safe=escHTML(txt);
  const re=new RegExp(escReg(kw),'gi');
  return safe.replace(re,m=>`<span class="highlight">${m}</span>`);
}

// ⑤ 渲染卡片
function renderList(data,kw){
  const box=document.getElementById('gongfa-list');
  if(!data.length){box.innerHTML='<p>无匹配结果</p>';return;}
  box.innerHTML=data.map(g=>`
    <div class="gongfa-card">
      <h2>${g.title}</h2>
      <div class="gongfa-meta">
        门派：${g.sect||'未知'}<br>
        品级：${g.grade||'未知'}<br>
        属性：${g.attr||'未知'}<br>
        类型：${g.type||'未知'}
      </div>
      <pre>${highlight(g.content,kw)}</pre>
    </div>
  `).join('');
}

// ⑥ 过滤
function filter(){
  const kw=document.getElementById('searchInput').value.trim();
  const sect =document.getElementById('sectFilter').value;
  const grade=document.getElementById('gradeFilter').value;
  const attr =document.getElementById('attrFilter').value;
  const type =document.getElementById('typeFilter').value;

  const res=window.gongfaData.filter(g=>
      (!kw   || g.content.toLowerCase().includes(kw.toLowerCase())) &&
      (!sect || g.sect===sect) &&
      (!grade|| g.grade===grade) &&
      (!attr || g.attr===attr) &&
      (!type || g.type===type)
  );
  renderList(res,kw);
}

// ⑦ 事件
['searchInput','sectFilter','gradeFilter','attrFilter','typeFilter']
  .forEach(id=>{
    document.getElementById(id).addEventListener(
      id==='searchInput'?'input':'change',filter);
  });

// ⑧ GO!
loadGongfa();
</script>
